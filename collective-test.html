<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>collective black hole test</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const uniforms = {
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uPixelRatio: { value: renderer.getPixelRatio() },
    };

    const vertexShader = `
      varying vec2 vUv;

      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;

      uniform float uTime;
      uniform vec2 uResolution;
      varying vec2 vUv;

      #define PI 3.141592653589793

      mat2 rot(float a) {
        float s = sin(a);
        float c = cos(a);
        return mat2(c, -s, s, c);
      }

      float hash(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 6; i++) {
          v += a * noise(p);
          p = rot(0.72) * p * 2.03 + vec2(9.1, 4.7);
          a *= 0.5;
        }
        return v;
      }

      float ridge(float x, float width) {
        return exp(-x * x / max(width, 0.0001));
      }

      vec3 fireRamp(float t) {
        t = clamp(t, 0.0, 1.0);
        vec3 deep = vec3(0.18, 0.015, 0.0);
        vec3 red = vec3(0.85, 0.075, 0.0);
        vec3 orange = vec3(1.0, 0.42, 0.035);
        vec3 gold = vec3(1.0, 0.80, 0.26);
        vec3 white = vec3(1.0, 0.96, 0.74);
        vec3 c = mix(deep, red, smoothstep(0.05, 0.32, t));
        c = mix(c, orange, smoothstep(0.24, 0.58, t));
        c = mix(c, gold, smoothstep(0.48, 0.82, t));
        c = mix(c, white, smoothstep(0.78, 1.0, t));
        return c;
      }

      vec3 diskLayer(vec2 p, float layer, float side) {
        float r = length(p);
        float a = atan(p.y, p.x);

        float gravity = 1.0 / (r * r + 0.035);
        float bend = 0.20 * gravity;
        float swirl = 0.17 * gravity + 0.08 * sin(3.0 * a + uTime * 0.18);
        vec2 q = p;
        q = rot(swirl) * q;
        q.y += side * bend * (0.09 + 0.018 * sin(2.0 * a + layer));
        q.x += 0.030 * sin(q.y * 7.0 + uTime * 0.15) * gravity;

        float qr = length(q);
        float qa = atan(q.y, q.x);
        float diskRadius = mix(0.78, 1.44, smoothstep(-1.0, 1.0, layer));
        float tilt = 0.18 + 0.04 * sin(layer * 2.4);

        float warpedPlane = q.y - side * (
          0.18 / (qr + 0.20)
          - 0.048 * qr
          + 0.025 * sin(qa * 4.0 + uTime * 0.28 + layer * 3.1)
        );
        float thickness = 0.034 + 0.022 * smoothstep(0.0, 1.0, qr) + 0.012 * fbm(q * 7.0 + layer);
        float lane = ridge(warpedPlane / max(tilt, 0.1), thickness);

        float radial = smoothstep(0.16, 0.31, qr) * (1.0 - smoothstep(diskRadius, diskRadius + 0.26, qr));
        float stream = fbm(vec2(qa * 5.2 + uTime * (0.26 + layer * 0.04), qr * 9.5 - uTime * 0.42 + layer * 4.0));
        float filament = pow(smoothstep(0.20, 1.0, stream), 2.2);
        float gaps = 0.58 + 0.42 * sin(qa * 18.0 + qr * 19.0 - uTime * 2.1 + stream * 4.0);
        float density = lane * radial * (0.55 + 0.95 * filament) * (0.68 + 0.32 * gaps);

        float doppler = smoothstep(-0.92, 0.72, cos(qa - 0.24));
        float beaming = mix(0.32, 1.85, doppler);
        float redshift = smoothstep(0.16, 0.72, qr);
        float heat = density * beaming * redshift;
        vec3 color = fireRamp(heat * 0.72 + filament * 0.35);

        color *= heat * (0.45 + 0.75 * layer);
        color *= mix(0.72, 1.18, smoothstep(0.0, 1.0, side * p.y + 0.52));
        return color;
      }

      vec3 lensedBridge(vec2 p) {
        float x = p.x;
        float y = p.y;
        float r = length(p);
        float a = atan(y, x);
        float safeR = max(r, 0.025);
        float gravity = 1.0 / (safeR * safeR + 0.040);
        float turbulent = fbm(vec2(a * 6.0 - uTime * 0.34, safeR * 12.0 + uTime * 0.18));
        float filaments = fbm(vec2(x * 8.0 + uTime * 0.24, y * 18.0 - uTime * 0.38));

        float coreAvoid = smoothstep(0.16, 0.26, r);
        float span = smoothstep(0.12, 0.42, abs(x)) * (1.0 - smoothstep(0.88, 1.18, abs(x)));
        float beaming = mix(0.48, 1.75, smoothstep(-0.42, 0.78, x + 0.09 * sin(a)));

        float upperCurve = 0.32 * exp(-x * x * 1.7) + 0.08 / (abs(x) + 0.42) - 0.075;
        upperCurve += 0.018 * sin(x * 9.0 + uTime * 0.55 + turbulent * 3.0);
        float lowerCurve = -0.25 * exp(-x * x * 1.45) - 0.045 / (abs(x) + 0.56) + 0.050;
        lowerCurve += 0.014 * sin(x * 8.0 - uTime * 0.42 + turbulent * 4.0);
        float frontCurve = 0.015 * sin(x * 5.0 + uTime * 0.22) - 0.040 * exp(-x * x * 4.8);

        float upper = ridge(y - upperCurve, 0.010 + 0.020 * abs(x) + 0.020 * turbulent);
        float lower = ridge(y - lowerCurve, 0.012 + 0.019 * abs(x) + 0.018 * turbulent);
        float front = ridge(y - frontCurve, 0.020 + 0.012 * turbulent);

        float density = (upper * 0.95 + lower * 0.82 + front * 0.75) * span * coreAvoid;
        density *= 0.45 + 1.15 * pow(filaments, 1.9);
        density *= 0.65 + 0.35 * sin(a * 22.0 + safeR * 29.0 - uTime * 2.2 + turbulent * 5.0);

        vec3 color = fireRamp(density * beaming * 0.92 + filaments * 0.22);
        return color * density * beaming * 0.42;
      }

      vec3 stars(vec2 p) {
        vec2 cell = floor(p * 190.0);
        vec2 f = fract(p * 190.0) - 0.5;
        float h = hash(cell);
        float star = smoothstep(0.998, 1.0, h) * exp(-dot(f, f) * 45.0);
        return vec3(star) * vec3(0.55, 0.70, 1.0) * 0.22;
      }

      void main() {
        vec2 p = (gl_FragCoord.xy - 0.5 * uResolution.xy) / min(uResolution.x, uResolution.y);

        float r = length(p);
        float a = atan(p.y, p.x);

        vec3 col = vec3(0.0);
        col += stars(p + vec2(7.1, 2.4));

        float lens = 1.0 / (r * r + 0.032);
        vec2 lensed = p;
        lensed = rot(0.038 * lens + 0.030 * sin(a * 2.0 - uTime * 0.12)) * lensed;
        lensed += normalize(p + 0.0001) * (0.022 * lens);

        vec3 lowerArc = diskLayer(lensed, 0.24, -1.0);
        vec3 upperArc = diskLayer(lensed, 0.78, 1.0);
        vec3 coreDisk = diskLayer(lensed * vec2(1.0, 0.86), 0.52, 0.0);
        col += coreDisk * 1.05;
        col += upperArc * 1.35;
        col += lowerArc * 1.20;
        col += lensedBridge(lensed) * 0.75;

        float photonBase = abs(r - 0.176);
        float ringJitter = 0.008 * fbm(vec2(a * 8.0, uTime * 0.24));
        float photonRing = exp(-pow((photonBase - ringJitter) / 0.009, 2.0));
        float subRing = exp(-pow((abs(r - 0.208) - ringJitter * 0.6) / 0.019, 2.0));
        float ringBeam = mix(0.42, 1.85, smoothstep(-0.65, 0.95, cos(a - 0.18)));
        col += fireRamp(0.86) * photonRing * ringBeam * 1.35;
        col += vec3(1.0, 0.42, 0.08) * subRing * ringBeam * 0.30;

        float glow = exp(-r * 2.4) * 0.055;
        glow += exp(-pow((r - 0.55) / 0.55, 2.0)) * 0.055;
        glow += exp(-pow(abs(p.y) / 0.56, 1.7)) * exp(-abs(p.x) * 1.05) * 0.035;
        col += vec3(1.0, 0.31, 0.045) * glow;

        float eventHorizon = smoothstep(0.190, 0.158, r);
        float innerShade = smoothstep(0.30, 0.17, r);
        col = mix(col, vec3(0.0), eventHorizon);
        col *= 1.0 - innerShade * 0.60;

        float shadowSoft = smoothstep(0.31, 0.18, r);
        col *= 1.0 - shadowSoft * 0.48;

        vec2 vignetteUv = vUv * (1.0 - vUv.yx);
        float vignette = pow(clamp(vignetteUv.x * vignetteUv.y * 14.0, 0.0, 1.0), 0.42);
        col *= vignette;

        col = max(col, vec3(0.0));
        col = col / (1.0 + col);
        col = pow(col, vec3(0.84));

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader,
      depthWrite: false,
      depthTest: false,
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(mesh);

    const clock = new THREE.Clock();

    function resize() {
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.uResolution.value.set(window.innerWidth * renderer.getPixelRatio(), window.innerHeight * renderer.getPixelRatio());
      uniforms.uPixelRatio.value = renderer.getPixelRatio();
    }

    window.addEventListener('resize', resize);
    resize();

    function render() {
      uniforms.uTime.value = clock.getElapsedTime();
      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
