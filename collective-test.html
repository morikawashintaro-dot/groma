<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>collective black hole test</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const uniforms = {
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uCenter: { value: new THREE.Vector2(window.innerWidth / 2, window.innerHeight / 2) },
      uPixelRatio: { value: renderer.getPixelRatio() },
    };

    const vertexShader = `
      varying vec2 vUv;

      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;

      uniform float uTime;
      uniform vec2 uResolution;
      uniform vec2 uCenter;
      varying vec2 vUv;

      #define PI 3.141592653589793
      const float DISK_TILT = 0.22;

      mat2 rot(float a) {
        float s = sin(a);
        float c = cos(a);
        return mat2(c, -s, s, c);
      }

      float hash(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 6; i++) {
          v += a * noise(p);
          p = rot(0.72) * p * 2.03 + vec2(9.1, 4.7);
          a *= 0.5;
        }
        return v;
      }

      float ridge(float x, float width) {
        return exp(-x * x / max(width, 0.0001));
      }

      vec2 centeredPosition(vec2 fragCoord) {
        return (fragCoord - uCenter) / min(uResolution.x, uResolution.y);
      }

      vec2 lensField(vec2 centered, float r, float a) {
        float lens = 1.0 / (r * r + 0.032);
        vec2 lensed = rot(0.038 * lens + 0.030 * sin(a * 2.0 - uTime * 0.12)) * centered;
        lensed *= 1.0 + 0.022 * lens;
        return lensed;
      }

      vec3 fireRamp(float t) {
        t = clamp(t, 0.0, 1.0);
        vec3 deep = vec3(0.18, 0.015, 0.0);
        vec3 red = vec3(0.85, 0.075, 0.0);
        vec3 orange = vec3(1.0, 0.42, 0.035);
        vec3 gold = vec3(1.0, 0.80, 0.26);
        vec3 white = vec3(1.0, 0.96, 0.74);
        vec3 c = mix(deep, red, smoothstep(0.05, 0.32, t));
        c = mix(c, orange, smoothstep(0.24, 0.58, t));
        c = mix(c, gold, smoothstep(0.48, 0.82, t));
        c = mix(c, white, smoothstep(0.78, 1.0, t));
        return c;
      }

      vec3 diskLayer(vec2 p, vec2 centered, float layer, float side) {
        float r = length(centered);
        float a = atan(centered.y, centered.x);

        float gravity = 1.0 / (r * r + 0.035);
        float bend = 0.20 * gravity;
        float swirl = 0.17 * gravity + 0.08 * sin(3.0 * a + uTime * 0.18);
        vec2 q = p;
        q = rot(swirl) * q;
        q.y += side * bend * (0.09 + 0.018 * sin(2.0 * a + layer));
        q.x += 0.030 * sin(q.y * 7.0 + uTime * 0.15) * gravity;

        float qr = length(q);
        float qa = atan(q.y, q.x);
        float diskRadius = mix(0.78, 1.44, smoothstep(-1.0, 1.0, layer));
        float tilt = 0.18 + 0.04 * sin(layer * 2.4);

        float warpedPlane = q.y - side * (
          0.18 / (qr + 0.20)
          - 0.048 * qr
          + 0.025 * sin(qa * 4.0 + uTime * 0.28 + layer * 3.1)
        );
        float thickness = 0.034 + 0.022 * smoothstep(0.0, 1.0, qr) + 0.012 * fbm(q * 7.0 + layer);
        float lane = ridge(warpedPlane / max(tilt, 0.1), thickness);

        float radial = smoothstep(0.16, 0.31, r) * (1.0 - smoothstep(diskRadius, diskRadius + 0.26, r));
        float stream = fbm(vec2(qa * 6.4 + uTime * (0.30 + layer * 0.06), qr * 11.0 - uTime * 0.54 + layer * 4.0));
        float filament = pow(smoothstep(0.20, 1.0, stream), 2.2);
        float fine = fbm(vec2(qa * 16.0 - uTime * 1.05 + layer * 2.0, qr * 28.0 + stream * 5.5));
        float streaks = pow(smoothstep(0.30, 1.0, 0.5 + 0.5 * sin(qa * 34.0 + qr * 42.0 - uTime * 2.8 + fine * 6.0)), 1.45);
        float gaps = 0.58 + 0.42 * sin(qa * 18.0 + qr * 19.0 - uTime * 2.1 + stream * 4.0);
        float density = lane * radial * (0.52 + 1.10 * filament) * (0.55 + 0.45 * gaps) * (0.62 + 0.78 * streaks);

        float doppler = smoothstep(-0.92, 0.72, cos(a - 0.24));
        float beaming = mix(0.32, 2.10, doppler);
        float redshift = smoothstep(0.16, 0.72, r);
        float innerHeat = 0.85 + 0.70 * (1.0 - smoothstep(0.20, 0.62, r));
        float heat = density * beaming * redshift * innerHeat;
        vec3 color = fireRamp(heat * 1.18 + filament * 0.42 + streaks * 0.25);

        color *= heat * (0.58 + 0.86 * layer);
        color *= mix(0.72, 1.18, smoothstep(0.0, 1.0, side * centered.y + 0.52));
        return color;
      }

      vec3 lensedBackArcs(vec2 p, vec2 centered) {
        float x = p.x;
        float y = p.y;
        float r = length(centered);
        float a = atan(centered.y, centered.x);
        float safeR = max(r, 0.025);
        float gravity = 1.0 / (safeR * safeR + 0.040);
        float turbulent = fbm(vec2(a * 6.0 - uTime * 0.34, safeR * 12.0 + uTime * 0.18));
        float filaments = fbm(vec2(centered.x * 10.0 + uTime * 0.30, centered.y * 22.0 - uTime * 0.48));
        float streaks = pow(smoothstep(0.26, 1.0, 0.5 + 0.5 * sin(a * 30.0 + safeR * 48.0 - uTime * 2.4 + filaments * 5.0)), 1.35);

        float coreAvoid = smoothstep(0.16, 0.26, r);
        float span = smoothstep(0.12, 0.42, abs(x)) * (1.0 - smoothstep(0.88, 1.18, abs(x)));
        float beaming = mix(0.48, 1.75, smoothstep(-0.42, 0.78, x + 0.09 * sin(a)));

        float upperCurve = 0.32 * exp(-x * x * 1.7) + 0.08 / (abs(x) + 0.42) - 0.075;
        upperCurve += 0.018 * sin(x * 9.0 + uTime * 0.55 + turbulent * 3.0);
        float lowerCurve = -0.25 * exp(-x * x * 1.45) - 0.045 / (abs(x) + 0.56) + 0.050;
        lowerCurve += 0.014 * sin(x * 8.0 - uTime * 0.42 + turbulent * 4.0);

        float upper = ridge(y - upperCurve, 0.010 + 0.020 * abs(x) + 0.020 * turbulent);
        float lower = ridge(y - lowerCurve, 0.012 + 0.019 * abs(x) + 0.018 * turbulent);

        float density = (upper * 1.08 + lower * 0.56) * span * coreAvoid;
        density *= 0.45 + 1.15 * pow(filaments, 1.9);
        density *= 0.55 + 0.50 * streaks;
        density *= 0.65 + 0.35 * sin(a * 22.0 + safeR * 29.0 - uTime * 2.2 + turbulent * 5.0);

        vec3 color = fireRamp(density * beaming * 1.05 + filaments * 0.28 + streaks * 0.22);
        return color * density * beaming * 0.48;
      }

      vec3 backEquatorialBand(vec2 p) {
        float x = p.x;
        float y = p.y;
        float r = length(p);
        float turbulence = fbm(vec2(x * 8.5 - uTime * 0.22, y * 24.0 + uTime * 0.16));

        float midline = 0.010 * sin(x * 5.2 + uTime * 0.20) + 0.006 * (turbulence - 0.5);
        float width = 0.012 + 0.014 * smoothstep(0.18, 0.92, abs(x));
        float core = exp(-pow((y - midline) / width, 2.0));
        float halo = exp(-pow((y - midline) / (width * 3.5), 2.0)) * 0.34;

        float span = smoothstep(0.13, 0.25, abs(x)) * (1.0 - smoothstep(1.16, 1.52, abs(x)));
        float behindShadow = smoothstep(0.175, 0.255, r);
        float photonEdge = exp(-pow((abs(x) - 0.215) / 0.036, 2.0)) * exp(-pow((y - midline) / 0.035, 2.0));
        float filaments = 0.55 + 0.45 * fbm(vec2(x * 24.0 - uTime * 0.82, y * 50.0 + uTime * 0.24));
        float streaks = smoothstep(0.24, 0.95, 0.5 + 0.5 * sin(x * 48.0 + y * 18.0 - uTime * 3.0 + filaments * 5.0));

        float rightDoppler = smoothstep(-0.72, 0.86, x);
        float beaming = mix(0.26, 2.45, rightDoppler);
        float density = (core * 0.82 + halo * 0.20 + photonEdge * 1.72) * span * behindShadow * filaments * (0.72 + 0.56 * streaks);

        vec3 away = vec3(0.62, 0.040, 0.006);
        vec3 warm = vec3(1.0, 0.34, 0.035);
        vec3 approach = vec3(1.0, 0.92, 0.48);
        vec3 color = mix(away, warm, smoothstep(-0.70, 0.05, x));
        color = mix(color, approach, rightDoppler);

        return color * density * beaming * 1.02;
      }

      vec3 frontDiskLayer(vec2 p, vec2 centered) {
        float x = p.x;
        float y = p.y;
        float r = length(centered);
        float a = atan(centered.y, centered.x);
        float turbulent = fbm(vec2(a * 6.0 - uTime * 0.30, r * 13.0 + uTime * 0.20));

        float lowerDepth = -centered.y;
        float lowerWindow = smoothstep(0.055, 0.135, lowerDepth) * (1.0 - smoothstep(0.225, 0.340, lowerDepth));
        float span = smoothstep(0.02, 0.11, abs(x)) * (1.0 - smoothstep(0.82, 1.12, abs(x)));
        float frontCurve = -0.130 + 0.012 * sin(x * 5.4 + uTime * 0.22) - 0.014 * exp(-x * x * 6.2);
        frontCurve += 0.006 * (turbulent - 0.5);
        float width = 0.010 + 0.006 * turbulent + 0.006 * smoothstep(0.0, 0.62, abs(x));
        float lane = ridge(y - frontCurve, width);
        float softHalo = ridge(y - frontCurve, width * 3.0) * 0.12;

        float filament = fbm(vec2(centered.x * 18.0 - uTime * 0.58, centered.y * 36.0 + uTime * 0.22));
        float rightDoppler = smoothstep(-0.58, 0.78, x);
        float beaming = mix(0.35, 2.05, rightDoppler);
        float density = (lane * 0.68 + softHalo) * span * lowerWindow * (0.55 + 0.62 * filament);

        vec3 color = mix(vec3(0.54, 0.035, 0.005), vec3(1.0, 0.80, 0.32), rightDoppler);
        return color * density * beaming * 0.56;
      }

      vec3 upperForegroundArc(vec2 p, vec2 centered) {
        float x = p.x;
        float y = p.y;
        float r = length(centered);
        float a = atan(centered.y, centered.x);
        float turbulent = fbm(vec2(a * 7.5 - uTime * 0.34, r * 16.0 + uTime * 0.25));

        float topDepth = centered.y;
        float topWindow = smoothstep(0.105, 0.172, topDepth) * (1.0 - smoothstep(0.305, 0.440, topDepth));
        float rimWindow = smoothstep(0.135, 0.185, r) * (1.0 - smoothstep(0.48, 0.78, r));
        float span = smoothstep(0.02, 0.12, abs(x)) * (1.0 - smoothstep(0.94, 1.22, abs(x)));
        float arcCurve = 0.158 + 0.030 * exp(-x * x * 2.4) + 0.014 * sin(x * 6.0 + uTime * 0.28);
        arcCurve += 0.009 * (turbulent - 0.5);
        float width = 0.010 + 0.009 * turbulent + 0.005 * smoothstep(0.0, 0.62, abs(x));
        float lane = ridge(y - arcCurve, width);
        float filament = fbm(vec2(centered.x * 22.0 - uTime * 0.82, centered.y * 46.0 + uTime * 0.24));
        float fine = smoothstep(0.28, 1.0, 0.5 + 0.5 * sin(x * 52.0 + y * 32.0 - uTime * 3.4 + filament * 6.0));

        float rightDoppler = smoothstep(-0.58, 0.80, x);
        float beaming = mix(0.34, 2.25, rightDoppler);
        float density = lane * topWindow * rimWindow * span * (0.62 + 0.64 * filament) * (0.72 + 0.52 * fine);

        vec3 color = mix(vec3(0.70, 0.060, 0.006), vec3(1.0, 0.95, 0.62), rightDoppler);
        return color * density * beaming * 0.72;
      }

      vec3 stars(vec2 p) {
        vec2 cell = floor(p * 210.0);
        vec2 f = fract(p * 210.0) - 0.5;
        float h = hash(cell);
        float star = smoothstep(0.9965, 1.0, h) * exp(-dot(f, f) * 58.0);
        float twinkle = 0.55 + 0.45 * sin(uTime * 1.7 + h * 40.0);
        vec3 starColor = mix(vec3(0.70, 0.82, 1.0), vec3(1.0), smoothstep(0.998, 1.0, h));
        return starColor * star * twinkle * 0.70;
      }

      void main() {
        vec2 centered = centeredPosition(gl_FragCoord.xy);

        float r = length(centered);
        float a = atan(centered.y, centered.x);

        vec3 col = vec3(0.0);
        col += stars(centered + vec2(7.1, 2.4));

        vec2 diskCentered = rot(-DISK_TILT) * centered;
        float diskR = length(diskCentered);
        float diskA = atan(diskCentered.y, diskCentered.x);
        vec2 lensed = lensField(diskCentered, diskR, diskA);
        vec2 coreDiskField = vec2(lensed.x, lensed.y * 0.86);

        vec3 lowerArc = diskLayer(lensed, diskCentered, 0.24, -1.0);
        vec3 upperArc = diskLayer(lensed, diskCentered, 0.78, 1.0);
        vec3 coreDisk = diskLayer(coreDiskField, diskCentered, 0.52, 0.0);
        vec3 backDisk = coreDisk * 0.68 + upperArc * 1.60 + lowerArc * 0.70;
        backDisk += lensedBackArcs(lensed, diskCentered) * 1.02;
        backDisk += backEquatorialBand(diskCentered) * 0.62;
        col += backDisk;

        float glow = exp(-r * 2.4) * 0.055;
        glow += exp(-pow((r - 0.55) / 0.55, 2.0)) * 0.055;
        glow += exp(-pow(abs(centered.y) / 0.56, 1.7)) * exp(-abs(centered.x) * 1.05) * 0.035;
        col += vec3(1.0, 0.31, 0.045) * glow;

        float eventHorizon = smoothstep(0.190, 0.158, r);
        float innerShade = smoothstep(0.30, 0.17, r);
        col = mix(col, vec3(0.0), eventHorizon);
        col *= 1.0 - innerShade * 0.60;

        float shadowSoft = smoothstep(0.31, 0.18, r);
        col *= 1.0 - shadowSoft * 0.48;

        col += upperForegroundArc(lensed, diskCentered) * 1.10;
        col += frontDiskLayer(lensed, diskCentered) * 1.12;

        float photonBase = abs(r - 0.176);
        float ringJitter = 0.0048 * fbm(vec2(a * 8.0, uTime * 0.24));
        float photonRing = exp(-pow((photonBase - ringJitter) / 0.0058, 2.0));
        float subRing = exp(-pow((abs(r - 0.208) - ringJitter * 0.6) / 0.017, 2.0));
        float ringBeam = mix(0.42, 1.85, smoothstep(-0.65, 0.95, cos(a - 0.18)));
        vec3 photonColor = mix(vec3(1.0, 0.62, 0.10), vec3(1.0, 0.98, 0.82), smoothstep(0.35, 1.0, ringBeam));
        col += photonColor * photonRing * ringBeam * 4.85;
        col += vec3(1.0, 0.50, 0.10) * subRing * ringBeam * 0.24;

        vec2 vignetteUv = vUv * (1.0 - vUv.yx);
        float vignette = pow(clamp(vignetteUv.x * vignetteUv.y * 14.0, 0.0, 1.0), 0.42);
        col *= vignette;

        col = max(col, vec3(0.0));
        col = col / (1.0 + col);
        col = pow(col, vec3(0.84));

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader,
      depthWrite: false,
      depthTest: false,
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(mesh);

    const clock = new THREE.Clock();

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      const rect = renderer.domElement.getBoundingClientRect();
      const width = rect.width * dpr;
      const height = rect.height * dpr;
      const center = { x: width / 2, y: height / 2 };

      uniforms.uResolution.value.set(width, height);
      uniforms.uCenter.value.set(center.x, center.y);
      uniforms.uPixelRatio.value = dpr;
    }

    window.addEventListener('resize', resize);
    resize();

    function render() {
      uniforms.uTime.value = clock.getElapsedTime();
      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
