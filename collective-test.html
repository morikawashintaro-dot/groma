<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>collective black hole test</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .error {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      color: #f8f2e8;
      background: #000;
      font: 15px/1.5 system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>
  <canvas id="black-hole"></canvas>
  <div class="error" id="webgl-error">WebGL is required to view this visualization.</div>

  <script>
    const canvas = document.getElementById('black-hole');
    const error = document.getElementById('webgl-error');
    const gl = canvas.getContext('webgl', {
      alpha: false,
      antialias: false,
      depth: false,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: false,
      stencil: false,
    }) || canvas.getContext('experimental-webgl');

    if (!gl) {
      error.style.display = 'grid';
      throw new Error('WebGL is not available');
    }

    const vertexSource = `
      attribute vec2 aPosition;
      varying vec2 vUv;

      void main() {
        vUv = aPosition * 0.5 + 0.5;
        gl_Position = vec4(aPosition, 0.0, 1.0);
      }
    `;

    const fragmentSource = `
      #ifdef GL_FRAGMENT_PRECISION_HIGH
      precision highp float;
      #else
      precision mediump float;
      #endif

      uniform vec2 uResolution;
      uniform float uTime;
      varying vec2 vUv;

      const float PI = 3.141592653589793;
      const float EVENT_RADIUS = 0.123;
      const float DISK_TILT = 0.405;

      float saturate(float value) {
        return clamp(value, 0.0, 1.0);
      }

      mat2 rotate2d(float angle) {
        float s = sin(angle);
        float c = cos(angle);
        return mat2(c, -s, s, c);
      }

      float hash(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);

        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));

        return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 5; i++) {
          v += a * noise(p);
          p = rotate2d(0.72) * p * 2.03 + vec2(13.7, 8.1);
          a *= 0.5;
        }
        return v;
      }

      vec2 lensWarp(vec2 p) {
        float d = max(length(p), 0.0001);
        vec2 dir = p / d;
        float deflection = EVENT_RADIUS / max(d * d, 0.018);
        float nearField = 1.0 - smoothstep(EVENT_RADIUS * 1.05, 1.12, d);
        return p + dir * deflection * 0.028 * nearField;
      }

      float sparseStars(vec2 p) {
        vec2 uv = p * vec2(uResolution.x / uResolution.y, 1.0);
        vec2 cell = floor(uv * 84.0);
        vec2 local = fract(uv * 84.0);
        float starSeed = hash(cell);
        vec2 starPos = vec2(hash(cell + 2.31), hash(cell + 7.83));
        float dotShape = smoothstep(0.045, 0.0, length(local - starPos));
        float sparse = step(0.986, starSeed);
        float twinkle = 0.72 + 0.28 * sin(uTime * (1.4 + starSeed * 3.0) + starSeed * 20.0);
        return dotShape * sparse * twinkle;
      }

      vec3 heatColor(float heat, float doppler) {
        vec3 ember = vec3(0.72, 0.08, 0.015);
        vec3 orange = vec3(1.0, 0.36, 0.055);
        vec3 gold = vec3(1.0, 0.72, 0.26);
        vec3 whiteHot = vec3(1.0, 0.96, 0.84);
        vec3 warm = mix(ember, orange, smoothstep(0.0, 0.45, heat));
        warm = mix(warm, gold, smoothstep(0.34, 0.78, heat));
        return mix(warm, whiteHot, smoothstep(0.62, 1.0, heat * doppler));
      }

      vec4 diskColorAtRadial(vec2 q, float radial, float line, float width, float mask, float layerStrength) {
        float radiusMask = smoothstep(0.145, 0.235, radial) * (1.0 - smoothstep(1.02, 1.22, radial));
        float band = exp(-(line * line) / max(width * width, 0.0001));
        band *= radiusMask * mask;

        float angle = atan(q.y * 2.7, q.x);
        float flow = radial * 44.0 - angle * 6.5 - uTime * 1.65;
        float turbulent = fbm(vec2(radial * 16.0 - uTime * 0.8, angle * 4.0 + uTime * 0.18));
        float strands = pow(0.5 + 0.5 * sin(flow + turbulent * 6.0), 5.0);
        float filaments = pow(0.5 + 0.5 * sin(q.x * 128.0 + q.y * 54.0 - uTime * 5.0 + turbulent * 8.0), 9.0);
        float granular = fbm(q * vec2(20.0, 58.0) + vec2(uTime * 0.3, -uTime * 0.12));
        float texture = 0.58 + strands * 0.34 + filaments * 0.24 + granular * 0.28;

        float heat = 1.0 - smoothstep(0.22, 1.06, radial);
        heat = saturate(heat + band * 0.22);
        float doppler = 0.48 + 1.04 * smoothstep(-0.78, 0.68, q.x);
        float alpha = saturate(band * texture * doppler * layerStrength);
        vec3 color = heatColor(heat, doppler) * alpha * (0.62 + heat * 0.88);

        return vec4(color, alpha);
      }

      vec4 diskColor(vec2 q, float line, float width, float mask, float layerStrength) {
        return diskColorAtRadial(q, abs(q.x), line, width, mask, layerStrength);
      }

      vec4 backDisk(vec2 p) {
        vec2 q = rotate2d(-DISK_TILT) * p;
        float radial = abs(q.x);
        float mainLine = -0.030 - 0.052 * exp(-radial * radial * 7.0);
        float sideBridge = smoothstep(0.48, 0.98, radial);

        float lensedCrown = 0.116 + 0.232 * exp(-radial * radial * 5.4);
        float upperArc = mix(lensedCrown, mainLine, sideBridge);
        float upperWidth = mix(0.035 + 0.030 * exp(-radial * radial * 4.1), 0.055, sideBridge);
        float upperMask = max(smoothstep(-0.035, 0.155, q.y), sideBridge * 0.74);
        float upperRadial = max(radial, EVENT_RADIUS * 1.55);
        vec4 upper = diskColorAtRadial(q, upperRadial, q.y - upperArc, upperWidth, upperMask, 1.26);
        float caustic = exp(-pow((q.y - upperArc) / max(upperWidth * 0.64, 0.001), 2.0));
        float crownHotspot = (1.0 - sideBridge) * smoothstep(0.17, 0.34, upperRadial) * (1.0 - smoothstep(0.62, 0.92, upperRadial));
        upper.rgb += vec3(1.0, 0.83, 0.56) * caustic * crownHotspot * 0.54;

        float lowerArc = -0.118 - 0.118 * exp(-radial * radial * 7.0);
        float lowerWidth = 0.022 + 0.014 * exp(-radial * radial * 3.4);
        vec4 lowerEcho = diskColor(q, q.y - lowerArc, lowerWidth, 1.0 - smoothstep(-0.20, -0.03, q.y), 0.22);

        return vec4(upper.rgb + lowerEcho.rgb, saturate(upper.a + lowerEcho.a));
      }

      vec4 frontDisk(vec2 p, vec2 rawP) {
        vec2 q = rotate2d(-DISK_TILT) * p;
        float radial = abs(q.x);
        float centerline = -0.030 - 0.052 * exp(-radial * radial * 7.0);
        float width = 0.045 + 0.025 * exp(-radial * radial * 4.5);
        float lowerHalf = 1.0 - smoothstep(0.035, 0.145, q.y);
        float outsideHorizon = smoothstep(EVENT_RADIUS * 1.04, EVENT_RADIUS * 1.34, length(rawP));
        return diskColor(q, q.y - centerline, width, lowerHalf * outsideHorizon, 1.08);
      }

      vec3 photonRing(float d, vec2 p) {
        float core = exp(-pow((d - EVENT_RADIUS * 1.045) / 0.0075, 2.0));
        float halo = exp(-pow((d - EVENT_RADIUS * 1.105) / 0.025, 2.0));
        float asymmetry = 0.84 + 0.34 * smoothstep(-0.24, 0.24, p.x);
        vec3 white = vec3(1.0, 0.96, 0.86);
        vec3 amber = vec3(1.0, 0.45, 0.08);
        return (white * core * 1.62 + amber * halo * 0.52) * asymmetry;
      }

      void main() {
        vec2 frag = gl_FragCoord.xy;
        vec2 p = (frag - uResolution * 0.5) / min(uResolution.x, uResolution.y);
        vec2 lensed = lensWarp(p);
        float d = length(p);

        vec2 starSpace = lensWarp(p * 1.28 + vec2(0.02 * sin(uTime * 0.05), 0.0));
        float stars = sparseStars(starSpace + vec2(0.43, 0.19));
        vec3 color = vec3(stars);
        color += vec3(0.018, 0.026, 0.04) * (1.0 - smoothstep(0.0, 1.22, length(p)));

        vec4 back = backDisk(lensed);
        color += back.rgb;

        float outerGlow = (1.0 - smoothstep(EVENT_RADIUS * 1.0, 0.62, d)) * 0.12 / (d * d + 0.05);
        color += vec3(1.0, 0.28, 0.045) * outerGlow;

        if (d < EVENT_RADIUS) {
          color = vec3(0.0);
        }

        color += photonRing(d, p);

        vec4 front = frontDisk(lensed, p);
        color += front.rgb;

        if (d < EVENT_RADIUS) {
          color = vec3(0.0);
        }

        float vignette = smoothstep(1.22, 0.22, length(p));
        color *= mix(0.34, 1.0, vignette);
        color = pow(max(color, vec3(0.0)), vec3(0.78));

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(shader) || 'Unknown shader error';
        gl.deleteShader(shader);
        throw new Error(log);
      }

      return shader;
    }

    function createProgram() {
      const vertexShader = compileShader(gl.VERTEX_SHADER, vertexSource);
      const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
      const program = gl.createProgram();

      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);
      gl.deleteShader(vertexShader);
      gl.deleteShader(fragmentShader);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const log = gl.getProgramInfoLog(program) || 'Unknown program error';
        gl.deleteProgram(program);
        throw new Error(log);
      }

      return program;
    }

    const program = createProgram();
    const positionLocation = gl.getAttribLocation(program, 'aPosition');
    const resolutionLocation = gl.getUniformLocation(program, 'uResolution');
    const timeLocation = gl.getUniformLocation(program, 'uTime');

    const triangle = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, triangle);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       3, -1,
      -1,  3,
    ]), gl.STATIC_DRAW);

    let width = 0;
    let height = 0;
    const startTime = performance.now();

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const nextWidth = Math.max(1, Math.floor(window.innerWidth * dpr));
      const nextHeight = Math.max(1, Math.floor(window.innerHeight * dpr));

      if (canvas.width !== nextWidth || canvas.height !== nextHeight) {
        canvas.width = nextWidth;
        canvas.height = nextHeight;
      }

      width = nextWidth;
      height = nextHeight;
      gl.viewport(0, 0, width, height);
    }

    function render(now) {
      resize();
      gl.useProgram(program);
      gl.bindBuffer(gl.ARRAY_BUFFER, triangle);
      gl.enableVertexAttribArray(positionLocation);
      gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
      gl.uniform2f(resolutionLocation, width, height);
      gl.uniform1f(timeLocation, (now - startTime) * 0.001);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(render);
    }

    window.addEventListener('resize', resize, { passive: true });
    requestAnimationFrame(render);
  </script>
</body>
</html>
